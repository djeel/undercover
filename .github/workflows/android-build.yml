name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  client:
    name: Client build, tests & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Deterministic root workspace install
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Client tests
        run: npm run test --workspace=client -- --run

      - name: Type-check client
        working-directory: ./client
        run: npx tsc -b

      - name: Build Web App (base ./)
        working-directory: ./client
        run: npx vite build --base ./

      - name: Sync Capacitor
        working-directory: ./client
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  server:
    name: Server tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server-py/requirements.txt

      - name: Install server dependencies
        working-directory: ./server-py
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: ./server-py
        run: python -m pytest tests -q